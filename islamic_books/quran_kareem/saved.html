<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⭐ Saved Ayahs</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Roboto:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f0f9f8;
      margin: 0;
      padding: 20px;
    }

    body.dark {
      background: #121212;
      color: #f0f0f0;
    }

    h2 {
      text-align: center;
      color: #1abc9c;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .ayah {
      background: #ffffff;
      margin-bottom: 20px;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    body.dark .ayah {
      background: #1e1e1e;
      color: #f0f0f0;
    }

    .arabic {
      font-family: 'Amiri', serif;
      font-size: 1.7rem;
      direction: rtl;
      text-align: right;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    body.dark .arabic {
      color: #e0e0e0;
    }

    .english {
      font-size: 1rem;
      color: #34495e;
      margin-bottom: 10px;
    }

    body.dark .english {
      color: #cccccc;
    }

    audio {
      width: 100%;
      margin-bottom: 10px;
    }

    .remove-btn {
      background-color: #e74c3c;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #c0392b;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 10px 20px;
      background-color: #1abc9c;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
    }

    .back-btn:hover {
      background-color: #16a085;
    }

    .meta {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 6px;
    }

    body.dark .meta {
      color: #aaa;
    }
  </style>
</head>
<body>
  <h2>⭐ Your Saved Ayahs</h2>
  <div id="savedContainer"></div>

  <!-- Back button to go to Quran page -->
  <a href="index.html" class="back-btn">⬅️ Back to Quran</a>

  <script>
    const container = document.getElementById("savedContainer");

    function loadFavorites() {
      const favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

      if (favorites.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>❌ No saved ayahs yet.</p>";
        return;
      }

      container.innerHTML = "";
      favorites.forEach((fav, index) => {
        const arabic = fav.arabic && fav.arabic.trim() !== "" ? fav.arabic : '📖 Arabic not found';
        const translation = fav.translation && fav.translation.trim() !== "" ? fav.translation : '💬 Translation not found';
        const audio = fav.audio || '';
        const location = fav.location || '';
        const ayahNum = fav.ayahNum || '';

        const div = document.createElement("div");
        div.className = "ayah";
        div.innerHTML = `
          <div class="meta">${location ? `📍 ${location}` : ''} ${ayahNum ? `| Ayah ${ayahNum}` : ''}</div>
          <div class="arabic">${arabic}</div>
          <div class="english">${translation}</div>
          ${audio ? `<audio controls src="${audio}"></audio>` : ''}
          <button class="remove-btn" onclick="removeAyah(${index})">🗑 Remove</button>
        `;
        container.appendChild(div);
      });
    }

    function removeAyah(index) {
      const favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
      favorites.splice(index, 1);
      localStorage.setItem("favorites", JSON.stringify(favorites));
      loadFavorites();
    }

    // Enable dark mode if previously set
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark");
    }

    loadFavorites();
  </script>
</body>
</html>
