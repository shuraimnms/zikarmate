<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⭐ Saved Ayahs</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Roboto:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f0f9f8;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #1abc9c;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .ayah {
      background: #ffffff;
      margin-bottom: 20px;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .arabic {
      font-family: 'Amiri', serif;
      font-size: 1.7rem;
      direction: rtl;
      text-align: right;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .english {
      font-size: 1rem;
      color: #34495e;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-bottom: 10px;
    }

    .remove-btn {
      background-color: #e74c3c;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #c0392b;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      text-align: center;
      padding: 10px 20px;
      background-color: #1abc9c;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
    }

    .back-btn:hover {
      background-color: #16a085;
    }
  </style>
</head>
<body>
  <h2>⭐ Your Saved Ayahs</h2>
  <div id="savedContainer"></div>

  <div style="text-align:center;">
    <a class="back-btn" href="index.html">⬅ Back to Home</a>
  </div>

  <script>
    const container = document.getElementById("savedContainer");

    function loadFavorites() {
      const favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
      if (favorites.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No saved ayahs yet.</p>";
        return;
      }

      container.innerHTML = "";
      favorites.forEach((fav, index) => {
        const div = document.createElement("div");
        div.className = "ayah";
        div.innerHTML = `
          <div class="arabic">${fav.arabic}</div>
          <div class="english">${fav.translation}</div>
          <audio controls src="${fav.audio}"></audio>
          <button class="remove-btn" onclick="removeAyah(${index})">🗑 Remove</button>
        `;
        container.appendChild(div);
      });
    }

    function removeAyah(index) {
      const favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
      favorites.splice(index, 1);
      localStorage.setItem("favorites", JSON.stringify(favorites));
      loadFavorites();
    }

    loadFavorites();
  </script>
</body>
</html>
