<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeenPlus - Quran</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Roboto:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<main>
  <h2 id="surah-title">📖 Loading...</h2>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search Ayah...">
    <button onclick="handleSearch()">🔍</button>
    <button onclick="startVoiceSearch()">🎙️</button>
  </div>

  <!-- Go to Ayah -->
  <div style="text-align:center; margin-top:10px;">
    <input type="number" id="goToAyahInput" placeholder="Go to Ayah..." style="width:100px;">
    <button onclick="goToAyah()">➡️</button>
  </div>

  <!-- Ayahs -->
  <div id="quran-container"></div>

  <!-- Footer -->
  <div class="footer-controls">
    <button onclick="toggleScroll()" id="scrollBtn">Auto Scroll: OFF</button>
    <button onclick="changeSpeed(-1)">➖</button>
    <span id="speedValue">3</span>
    <button onclick="changeSpeed(1)">➕</button>
    <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    
  </div>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const surah = params.get("surah");
  const juz = params.get("juz");
  const container = document.getElementById("quran-container");
  const title = document.getElementById("surah-title");
  const darkModeBtn = document.getElementById("darkModeBtn");

  let currentAyahs = [];
  let scrollOn = false;
  let scrollInterval;
  let speed = 3;
  const speedValue = document.getElementById("speedValue");
  const scrollBtn = document.getElementById("scrollBtn");

  // Load preferred mode
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    darkModeBtn.textContent = "🌞";
  }

  function toggleScroll() {
    scrollOn = !scrollOn;
    scrollBtn.innerText = `Auto Scroll: ${scrollOn ? 'ON' : 'OFF'}`;
    scrollOn ? startAutoScroll() : stopAutoScroll();
  }

  function startAutoScroll() {
    stopAutoScroll();
    scrollInterval = setInterval(() => window.scrollBy(0, 1), Math.max(1, 1000 / speed));
  }

  function stopAutoScroll() {
    clearInterval(scrollInterval);
  }

  function changeSpeed(delta) {
    speed = Math.max(1, speed + delta);
    speedValue.innerText = speed;
    if (scrollOn) startAutoScroll();
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    darkModeBtn.textContent = isDark ? "🌞" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  }

  function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
  }

  function toggleFavorite(ayahId) {
    let favs = getFavorites();
    const isFav = favs.includes(ayahId);

    if (isFav) {
      favs = favs.filter(f => f !== ayahId);
    } else {
      favs.push(ayahId);
    }

    localStorage.setItem("favorites", JSON.stringify(favs));

    // Update button only
    const btn = document.querySelector(`button[data-favid="${ayahId}"]`);
    if (btn) btn.innerText = isFav ? "🤍 Save" : "⭐ Saved";
  }

  function isFavorite(ayahId) {
    return getFavorites().includes(ayahId);
  }

  function copyAyah(arabic, english) {
    const text = `${arabic || 'Arabic not found'}\n\n${english || 'Translation not found'}`;
    navigator.clipboard.writeText(text).then(() => alert("📋 Ayah copied!"));
  }

  function shareAyah(arabic, english) {
    const shareText = `📖 Quran Ayah:\n\n${arabic || ''}\n\n💬 ${english || ''}`;
    if (navigator.share) {
      navigator.share({ title: 'Quran Ayah', text: shareText }).catch(() => {});
    } else {
      navigator.clipboard.writeText(shareText).then(() => {
        alert("📋 Ayah copied! You can now paste it anywhere.");
      });
    }
  }

  function displayAyahs(ayahs) {
    container.innerHTML = "";
    const last = JSON.parse(localStorage.getItem("lastRead"));

    ayahs.forEach((ayah) => {
      const ayahNum = ayah.number.inSurah;
      const favId = `${surah ? "surah" : "juz"}-${surah || juz}-${ayahNum}`;
      const div = document.createElement("div");
      div.className = "ayah";
      div.id = `ayah-${ayahNum}`;

      if (last?.type === (surah ? "surah" : "juz") && parseInt(last.number) === parseInt(surah || juz) && ayahNum === last.ayah) {
        div.classList.add("highlight");
        setTimeout(() => div.scrollIntoView({ behavior: "smooth", block: "start" }), 500);
      }

      div.innerHTML = `
        <div class="ayah-num">Ayah ${ayahNum}</div>
        <div class="arabic">${ayah.text?.arab || '📖 Arabic not found'}</div>
        <div class="english">${ayah.translation?.en || '💬 Translation not found'}</div>
        <audio controls preload="none" src="${ayah.audio?.primary || ''}"></audio>
        <div class="share-buttons">
          <button onclick="copyAyah(\`${ayah.text?.arab || ''}\`, \`${ayah.translation?.en || ''}\`)">📋</button>
          <button onclick="shareAyah(\`${ayah.text?.arab || ''}\`, \`${ayah.translation?.en || ''}\`)">🔗</button>
          <button onclick="toggleFavorite('${favId}')" data-favid="${favId}">${isFavorite(favId) ? "⭐ Saved" : "🤍 Save"}</button>
        </div>
      `;

      div.addEventListener('click', () => {
        localStorage.setItem('lastRead', JSON.stringify({
          type: surah ? "surah" : "juz",
          number: surah || juz,
          ayah: ayahNum
        }));
      });

      container.appendChild(div);
    });

    const audios = document.querySelectorAll("audio");
    audios.forEach(audio => {
      audio.addEventListener("play", () => {
        audios.forEach(a => { if (a !== audio) a.pause(); });
      });
    });
  }

  async function loadSurah(num) {
    try {
      const res = await fetch(`https://api.quran.gading.dev/surah/${num}`);
      const data = await res.json();
      title.innerText = `${data.data.name.transliteration.en} - ${data.data.name.translation.en}`;
      currentAyahs = data.data.verses;
      displayAyahs(currentAyahs);
    } catch {
      container.innerHTML = "<p style='text-align:center;'>❌ Failed to load Surah.</p>";
    }
  }

  async function loadJuz(num) {
    try {
      const res = await fetch(`https://api.quran.gading.dev/juz/${num}`);
      const data = await res.json();
      title.innerText = `📗 Juz ${num}`;
      currentAyahs = data.data.verses;
      displayAyahs(currentAyahs);
    } catch {
      container.innerHTML = "<p style='text-align:center;'>❌ Failed to load Juz.</p>";
    }
  }

  function handleSearch() {
    const input = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!input || currentAyahs.length === 0) return;

    const filtered = currentAyahs.filter(ayah =>
      ayah.text?.arab?.toLowerCase().includes(input) ||
      ayah.translation?.en?.toLowerCase().includes(input) ||
      String(ayah.number?.inSurah || "").includes(input)
    );

    if (filtered.length > 0) {
      displayAyahs(filtered);
      title.innerText = `🔍 Results for "${input}"`;
    } else {
      container.innerHTML = "<p style='text-align:center;'>❌ No matches found.</p>";
    }
  }

  function startVoiceSearch() {
    try {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("🎙️ Voice search not supported in this browser.");

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function (event) {
        document.getElementById("searchInput").value = event.results[0][0].transcript;
        handleSearch();
      };

      recognition.onerror = function () {
        alert("🎙️ Voice recognition failed. Please try again.");
      };
    } catch {
      alert("🎙️ Voice search not supported in this browser.");
    }
  }

  function goToAyah() {
    const ayahNum = parseInt(document.getElementById("goToAyahInput").value);
    const element = document.getElementById(`ayah-${ayahNum}`);
    if (element) {
      element.scrollIntoView({ behavior: "smooth", block: "center" });
      element.classList.add("highlight");
      setTimeout(() => element.classList.remove("highlight"), 3000);
    } else {
      alert("❌ Ayah not found");
    }
  }

  if (surah) loadSurah(surah);
  else if (juz) loadJuz(juz);
  else container.innerHTML = "<p style='text-align:center;'>❌ Surah or Juz not found</p>";
</script>

</body>
</html>
